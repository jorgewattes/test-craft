[package]
name = "caderno"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = { version = "0.32.3", features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
xml-rs = "0.8.29"
flate2 = "1.1.10"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
