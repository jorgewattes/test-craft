name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check signing safeguards
        shell: pwsh
        run: ./scripts/test-windows-signing.ps1
      - name: Read release signing policy
        id: signing
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          if (-not $version) { throw 'Versao invalida no Cargo.toml.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag diferente da versao do Cargo.toml.' }
          $config = Get-Content release-config.json -Raw | ConvertFrom-Json
          $unsigned = ($config.unsignedReleaseVersion -ceq $version).ToString().ToLowerInvariant()
          "unsigned=$unsigned" >> $env:GITHUB_OUTPUT
      - name: Load code signing certificate
        if: steps.signing.outputs.unsigned != 'true'
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.TEST_CRAFT_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.TEST_CRAFT_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64 -or -not $env:SIGNING_PFX_PASSWORD) {
            throw 'Configure os secrets TEST_CRAFT_SIGNING_PFX_BASE64 e TEST_CRAFT_SIGNING_PFX_PASSWORD com um certificado confiavel de assinatura de codigo. Releases sem assinatura estao bloqueadas.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid().ToString() + '.pfx')
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $certificates = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            "TEST_CRAFT_IMPORTED_CERTIFICATES=$($certificates.Thumbprint -join ',')" >> $env:GITHUB_ENV
            $signers = @($certificates | Where-Object { $_.HasPrivateKey })
            if ($signers.Count -ne 1) { throw 'O PFX precisa conter exatamente uma identidade com chave privada.' }
            "TEST_CRAFT_SIGNING_THUMBPRINT=$($signers[0].Thumbprint)" >> $env:GITHUB_ENV
          } finally {
            if (Test-Path -LiteralPath $pfxPath) { Remove-Item -LiteralPath $pfxPath -Force }
          }
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build-release.ps1 -Repository "$env:GITHUB_REPOSITORY"
      - name: Select release files
        id: release
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          if (-not $version) { throw 'Versao invalida no Cargo.toml.' }
          "package=test-craft-$version-windows-x64" >> $env:GITHUB_OUTPUT
      - name: Keep Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            dist/${{ steps.release.outputs.package }}.zip
            dist/${{ steps.release.outputs.package }}.msi
            dist/${{ steps.release.outputs.package }}.zip.sha256
            dist/${{ steps.release.outputs.package }}.msi.sha256
            dist/release-notes.md
            dist/signing-status.json
      - name: Remove imported certificates
        if: always()
        shell: pwsh
        run: |
          if ($env:TEST_CRAFT_IMPORTED_CERTIFICATES) {
            foreach ($thumbprint in ($env:TEST_CRAFT_IMPORTED_CERTIFICATES -split ',')) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -DeleteKey -ErrorAction SilentlyContinue
            }
          }
      - name: Publish stable release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PACKAGE: ${{ steps.release.outputs.package }}
        run: |
          $assets = @("dist/$env:RELEASE_PACKAGE.msi", "dist/$env:RELEASE_PACKAGE.zip", "dist/$env:RELEASE_PACKAGE.msi.sha256", "dist/$env:RELEASE_PACKAGE.zip.sha256")
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Pacote ausente: $asset" }
          }
          gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag --title "Test Craft $env:GITHUB_REF_NAME" --notes-file dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar release' }
