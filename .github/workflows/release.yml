name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build-release.ps1 -Repository "$env:GITHUB_REPOSITORY"
      - name: Keep Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Publish stable release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --verify-tag --title "Caderno $env:GITHUB_REF_NAME" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar release' }
